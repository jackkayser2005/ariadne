plugins {
    id "com.android.application"
}

android {
    namespace "dev.ariadne.fixture"
    compileSdk 36

    defaultConfig {
        applicationId "dev.ariadne.fixture"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
