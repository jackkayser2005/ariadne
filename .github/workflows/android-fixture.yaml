name: Android fixture

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-fixture.yaml"
      - "fixture/android/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-fixture.yaml"
      - "fixture/android/**"

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixture/android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        run: echo "55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Build and test
        run: chmod +x gradlew && ./gradlew --no-daemon lintDebug testDebugUnitTest createDebugUnitTestCoverageReport assembleDebug
