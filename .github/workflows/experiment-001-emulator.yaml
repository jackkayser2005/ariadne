name: Experiment 001 emulator

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/experiment-001-emulator.yaml"
      - "cmd/**"
      - "examples/experiment-001.json"
      - "fixture/android/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/experiment-001-emulator.yaml"
      - "cmd/**"
      - "examples/experiment-001.json"
      - "fixture/android/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Gradle wrapper
        working-directory: fixture/android
        run: echo "55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check

      - name: Build Ariadne and fixture
        run: |
          go build -o "${RUNNER_TEMP}/ariadne" ./cmd/ariadne
          chmod +x fixture/android/gradlew
          fixture/android/gradlew --no-daemon --project-dir fixture/android assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Experiment 001
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-port: 5554
          script: |
            adb -s emulator-5554 install -r fixture/android/app/build/outputs/apk/debug/app-debug.apk
            "${RUNNER_TEMP}/ariadne" android check \
              --device emulator-5554 \
              --package dev.ariadne.fixture
            "${RUNNER_TEMP}/ariadne" experiment run \
              --device emulator-5554 \
              --package dev.ariadne.fixture \
              --output .ariadne/ci/experiment-001 \
              examples/experiment-001.json
            "${RUNNER_TEMP}/ariadne" experiment report .ariadne/ci/experiment-001

            jq -e '
              (.artifacts | length == 6) and
              (.comparison.unchanged_fields == ["region"]) and
              (.comparison.differences | length == 1) and
              (
                .comparison.differences[0] |
                .field == "variant" and
                .baseline == "standard" and
                .treatment == "personalized" and
                .state == "observed"
              )
            ' .ariadne/ci/experiment-001/evidence.json

            baseline_email="$(jq -r '.baseline.email' examples/experiment-001.json)"
            treatment_email="$(jq -r '.treatment.email' examples/experiment-001.json)"
            if grep -R -F -q \
              -e "${baseline_email}" \
              -e "${treatment_email}" \
              .ariadne/ci/experiment-001; then
              echo "persona value found in evidence output" >&2
              exit 1
            fi

      - name: Upload evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: experiment-001-${{ github.sha }}
          path: .ariadne/ci/experiment-001
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
