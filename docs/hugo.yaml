baseURL: https://jackkayser2005.github.io/ariadne/
locale: en-US
title: Ariadne

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: GitHub
      url: https://github.com/jackkayser2005/ariadne
      weight: 2
      params:
        icon: github
    - name: Search
      weight: 3
      params:
        type: search

params:
  description: Counterfactual privacy analysis
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: true
    displayPoweredBy: true
  editURL:
    enable: true
    base: https://github.com/jackkayser2005/ariadne/edit/main/docs/content
  theme:
    default: system
    displayToggle: true

caches:
  images:
    dir: :cacheDir/images
